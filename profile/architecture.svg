<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">
  <title>글결 구조 — 브라우저, 실습 서버의 Docker Compose(화면 Nginx, Spring Boot 서버, Redis, MinIO), 바깥 서비스(PostgreSQL, Gmail, 소셜 로그인 회사), GitHub Actions 배포 순서</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6f9c7e"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#e3ece5" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="880" fill="#f6f8f4"/>
  <rect width="1280" height="880" fill="url(#grid)"/>

  <!-- 브라우저 -->
  <g>
    <rect x="40" y="130" width="190" height="110" rx="12" fill="#ffffff" stroke="#2c6a4d" stroke-width="2"/>
    <text x="135" y="175" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2721">브라우저</text>
    <text x="135" y="202" text-anchor="middle" font-size="13" fill="#55635a">React 19 · Vite 8</text>
    <text x="135" y="222" text-anchor="middle" font-size="13" fill="#55635a">세션 쿠키 + CSRF 헤더</text>
  </g>

  <!-- 바깥 Nginx -->
  <rect x="290" y="40" width="720" height="56" rx="10" fill="#1d2721"/>
  <text x="650" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#e4ece6">바깥 Nginx · geulgyeol.java21.net</text>
  <text x="650" y="86" text-anchor="middle" font-size="12" fill="#a7b6ac">도메인을 화면 컨테이너 한 곳으로 넘긴다</text>
  <path d="M135 130 V68 H288" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 실습 서버 -->
  <rect x="290" y="120" width="720" height="460" rx="16" fill="none" stroke="#6f9c7e" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="306" y="110" width="250" height="22" fill="#f6f8f4"/>
  <text x="314" y="126" font-size="14" font-weight="700" fill="#2c6a4d">실습 서버 · Docker Compose</text>
  <path d="M650 96 V146" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 화면 컨테이너 -->
  <rect x="320" y="148" width="660" height="78" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="344" y="180" font-size="17" font-weight="700" fill="#1d2721">화면 컨테이너 · Nginx</text>
  <text x="344" y="206" font-size="13" fill="#55635a">React 빌드 결과를 내준다 · /api · /oauth2 · /login/oauth2 · /og · /rss.xml · /sitemap.xml은 서버로</text>
  <path d="M650 226 V256" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 서버 -->
  <rect x="320" y="258" width="660" height="196" rx="12" fill="#ffffff" stroke="#2c6a4d" stroke-width="2"/>
  <text x="344" y="292" font-size="17" font-weight="700" fill="#1d2721">서버 컨테이너 · Spring Boot 4.1 · Java 21</text>
  <text x="344" y="316" font-size="13" fill="#55635a">한 서버 안을 기능별 모듈로 나눈다 (Spring Modulith가 모듈 방향을 테스트로 지킨다)</text>
  <g font-size="14" font-weight="700" fill="#1d4a35" text-anchor="middle">
    <rect x="344" y="332" width="76" height="34" rx="8" fill="#dfe9e1"/><text x="382" y="354">user</text>
    <rect x="428" y="332" width="76" height="34" rx="8" fill="#dfe9e1"/><text x="466" y="354">blog</text>
    <rect x="512" y="332" width="76" height="34" rx="8" fill="#dfe9e1"/><text x="550" y="354">post</text>
    <rect x="596" y="332" width="96" height="34" rx="8" fill="#dfe9e1"/><text x="644" y="354">comment</text>
    <rect x="700" y="332" width="108" height="34" rx="8" fill="#dfe9e1"/><text x="754" y="354">community</text>
    <rect x="816" y="332" width="68" height="34" rx="8" fill="#dfe9e1"/><text x="850" y="354">image</text>
    <rect x="892" y="332" width="64" height="34" rx="8" fill="#fff3b0"/><text x="924" y="354">stats</text>
  </g>
  <text x="344" y="396" font-size="13" fill="#55635a">user ← blog ← post ← comment · community · image   ·   stats는 읽기만</text>
  <text x="344" y="420" font-size="13" fill="#55635a">Spring Security(세션 · CSRF · OAuth2 Client) · Spring Session JDBC · JPA · Flyway</text>
  <text x="344" y="440" font-size="13" fill="#55635a">API 주소 /api/v1 · 자동 API 문서(springdoc, 개발 서버)</text>

  <!-- Redis, MinIO -->
  <path d="M482 454 V484" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M818 454 V484" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="320" y="486" width="324" height="74" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="344" y="516" font-size="16" font-weight="700" fill="#1d2721">Redis 8</text>
  <text x="344" y="540" font-size="13" fill="#55635a">잃어도 되는 짧은 값: 인증번호, 조회수 중복 막기</text>
  <rect x="656" y="486" width="324" height="74" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="680" y="516" font-size="16" font-weight="700" fill="#1d2721">MinIO</text>
  <text x="680" y="540" font-size="13" fill="#55635a">글에 넣는 이미지 (S3 방식 저장소)</text>

  <!-- 바깥 서비스 -->
  <text x="1050" y="244" font-size="14" font-weight="700" fill="#2c6a4d">바깥 서비스</text>
  <rect x="1050" y="258" width="200" height="96" rx="12" fill="#ffffff" stroke="#2c6a4d" stroke-width="2"/>
  <text x="1070" y="290" font-size="16" font-weight="700" fill="#1d2721">PostgreSQL</text>
  <text x="1070" y="314" font-size="13" fill="#55635a">회원 · 글 · 댓글 · 통계</text>
  <text x="1070" y="334" font-size="13" fill="#55635a">로그인 세션도 여기에</text>
  <rect x="1050" y="370" width="200" height="76" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="1070" y="402" font-size="16" font-weight="700" fill="#1d2721">Gmail SMTP</text>
  <text x="1070" y="426" font-size="13" fill="#55635a">가입 인증 메일</text>
  <rect x="1050" y="462" width="200" height="96" rx="12" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="1070" y="494" font-size="16" font-weight="700" fill="#1d2721">소셜 로그인</text>
  <text x="1070" y="518" font-size="13" fill="#55635a">GitHub · Google</text>
  <text x="1070" y="538" font-size="13" fill="#55635a">카카오 · 네이버 (OAuth2)</text>
  <path d="M980 300 H1048" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M980 408 H1048" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M980 440 C1016 440 1016 504 1048 504" fill="none" stroke="#6f9c7e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CI/CD -->
  <rect x="40" y="610" width="1210" height="240" rx="16" fill="#ffffff" stroke="#a9c8b2" stroke-width="2"/>
  <text x="64" y="646" font-size="18" font-weight="700" fill="#1d2721">CI/CD · GitHub Actions</text>
  <text x="64" y="670" font-size="13" fill="#55635a">PR마다 자동 검사, 배포는 릴리스를 낼 때만. 실패하면 멈추고 서버는 그대로 둔다</text>
  <g font-size="13">
    <rect x="64" y="696" width="176" height="96" rx="12" fill="#e3ecf7"/>
    <text x="80" y="726" font-size="15" font-weight="700" fill="#1d2721">1 PR 올리기</text>
    <text x="80" y="750" fill="#55635a">기능 브랜치 → PR</text>
    <text x="80" y="770" fill="#55635a">명세 tasks.md 작업 ID</text>

    <rect x="260" y="696" width="176" height="96" rx="12" fill="#dfe9e1"/>
    <text x="276" y="726" font-size="15" font-weight="700" fill="#1d2721">2 CI</text>
    <text x="276" y="750" fill="#55635a">서버 mvn verify</text>
    <text x="276" y="770" fill="#55635a">화면 lint · build</text>

    <rect x="456" y="696" width="176" height="96" rx="12" fill="#dfe9e1"/>
    <text x="472" y="726" font-size="15" font-weight="700" fill="#1d2721">3 리뷰 · 품질</text>
    <text x="472" y="750" fill="#55635a">CodeRabbit 코드 리뷰</text>
    <text x="472" y="770" fill="#55635a">SonarQube 품질 분석</text>

    <rect x="652" y="696" width="176" height="96" rx="12" fill="#fff3b0"/>
    <text x="668" y="726" font-size="15" font-weight="700" fill="#1d2721">4 릴리스 확인</text>
    <text x="668" y="750" fill="#55635a">번호 · 서버 · 화면 버전</text>
    <text x="668" y="770" fill="#55635a">CHANGELOG 절이 맞는지</text>

    <rect x="848" y="696" width="176" height="96" rx="12" fill="#fff3b0"/>
    <text x="864" y="726" font-size="15" font-weight="700" fill="#1d2721">5 배포</text>
    <text x="864" y="750" fill="#55635a">이미지 빌드 → SSH 전송</text>
    <text x="864" y="770" fill="#55635a">compose up · 상태 확인</text>

    <rect x="1044" y="696" width="182" height="96" rx="12" fill="#f6e3d4"/>
    <text x="1060" y="726" font-size="15" font-weight="700" fill="#1d2721">6 기록</text>
    <text x="1060" y="750" fill="#55635a">태그 v0.x.0</text>
    <text x="1060" y="770" fill="#55635a">GitHub 릴리스 노트</text>
  </g>
  <g stroke="#6f9c7e" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M240 744 H258"/><path d="M436 744 H454"/><path d="M632 744 H650"/><path d="M828 744 H846"/><path d="M1024 744 H1042"/>
  </g>
  <text x="64" y="830" font-size="12" fill="#55635a">비밀 값(DB · 메일 · 소셜 로그인 열쇠)은 GitHub Secrets → 서버의 환경 변수로만 들어간다. 저장소에는 없다</text>
</svg>
